version: "3.8"

services:
  db:
    image: postgres:16
    container_name: leads_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: leads_user
      POSTGRES_PASSWORD: leads_pass
      POSTGRES_DB: leads_saude
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leads_user -d leads_saude"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: leads_api
    restart: unless-stopped
    env_file:
      - ./api/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: leads_user
      DB_PASSWORD: leads_pass
      DB_NAME: leads_saude
      DB_PORT: 5432

volumes:
  pgdata:
